name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: projeto_es_2526
        run: flutter pub get

      - name: Analyze
        working-directory: projeto_es_2526
        run: flutter analyze

      - name: Unit & widget tests
        working-directory: projeto_es_2526
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: projeto_es_2526/coverage/lcov.info
          fail_ci_if_error: false
